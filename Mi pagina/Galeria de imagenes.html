<!DOCTYPE html>

<style>
    figure {
        text-align: center;
        width: 260px;
        margin: 20px auto;
    }

    img {
        height: 220px;
        width: 100%;
        object-fit: cover;
        border-radius: 10px;
    }

    figcaption {
        margin-top: 8px;
        font-size: 14px;
        line-height: 1.4;
        text-align: center;
    }

    .galeria {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 25px;
    }

    h3 {
        text-align: center;
        margin-top: 40px;
    }
</style>


<!-- Galería 1: Atardecer -->
<h3>Galería 1: Atardecer</h3>
<div class="galeria">

<figure>
<img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Playa" />
<figcaption>
Una hermosa playa de arena clara y agua azul cristalina, perfecta para relajarse y disfrutar del sonido suave de las olas en un paisaje lleno de tranquilidad.
</figcaption>
</figure>

<figure>
<img src="https://images.unsplash.com/photo-1494783367193-149034c05e8f" alt="Bosque" />
<figcaption>
Una calle abandonada pero hermosa con  y senderos secos, ideal para caminatas y para conectarse con la naturaleza en un ambiente fresco y pacífico.
</figcaption>
</figure>

</div>


<!-- Galería 2: Objetos en venta -->
<h3>Galería 2:Objetos en venta</h3>
<div class="galeria">

<figure>
<img src="https://images.unsplash.com/photo-1467269204594-9661b134dd2b" alt="Ciudad de noche" />
<figcaption>
Una casa hermosa y moderna iluminada por miles de luces que brillan durante la noche, mostrando la vida activa y vibrante de un entorno urbano lleno de energía.
</figcaption>
</figure>

<figure>
<img src="https://images.unsplash.com/photo-1508057198894-247b23fe5ade" alt="Rascacielos" />
<figcaption>
Un hermoso reloj dorado y brillante, reflejando la arquitectura moderna y el crecimiento de las grandes metrópolis del mundo.
</figcaption>
</figure>

<figure>
<img src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8" alt="Puente" />
<figcaption>
Un majestuoso carro que cruza una gran vía a gran velocidad, un símbolo de conexión entre lugares y ejemplo del ingenio humano en la construcción urbana.
</figcaption>
</figure>

<figure>
<img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d" alt="Calles antiguas" />
<figcaption>
Zapato de calidad que te va a encantar, donde cada zapato refleja la cultura y arquitectura tradicional de épocas pasadas.
</figcaption>
</figure>

</div>


<!-- Galería 3: Animales y Naturaleza  -->
<h3>Galería 3: Animales y Naturaleza </h3>
<div class="galeria">

<figure>
<img src="https://images.unsplash.com/photo-1474511320723-9a56873867b5" alt="Tigre" />
<figcaption>
Un majestuoso zorro observando atentamente su entorno, mostrando su fuerza, elegancia y el misterio que caracteriza a los grandes felinos.
</figcaption>
</figure>

<figure>
<img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429" alt="Pájaro" />
<figcaption>
Un hermoso paisaje y bosque, destacando la belleza y delicadeza de losarboles en su entorno natural lleno de vida.
</figcaption>
</figure>

<figure>
<img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131" alt="Perro" />
<figcaption>
Un adorable gato mirando directamente a la cámara con expresión tierna, representando lealtad, compañía y amistad incondicional.
</figcaption>
</figure>

<figure>
<img src="https://images.unsplash.com/photo-1508672019048-805c876b67e2" alt="Caballo" />
<figcaption>
Una persona observando libremente en campo abierto, reflejando fuerza, libertad y la conexión profunda entre el agua y la naturaleza.
</figcaption>
</figure>

</div>
